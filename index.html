<!-- Main HTML file for A4 Editor -->
<!-- A minimalistic A4-style text editor for notes, built as a Progressive Web App -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F0F0F0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="msapplication-navbutton-color" content="#F0F0F0">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="A4 Editor">
    <meta name="application-name" content="A4 Editor">
    <meta name="description" content="A minimalistic A4-style text editor for notes.">
    <title>A4 Editor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imgs/ico.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="imgs/ico.png">
    <link rel="preload" href="fonts/IBMPlexMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
    <!-- Main textarea for writing content -->
    <textarea id="main-textarea" spellcheck="false" autofocus></textarea>
    
    <!-- Status indicator and interaction target (top-right dot) -->
    <div id="marker"></div>
    <div id="marker-button"></div>
    
    <!-- Transparent background overlay for modals -->
    <div id="transparent-bg"></div>
    
    <!-- Main settings menu -->
    <div id="menu-container">
        <div id="menu">
            <div id="menu-close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18"><path d="M 0 0 L 18 18 M 18 0 L 0 18"></path></svg></div>
            <img src="imgs/logo.svg" alt="A4 Editor Logo">
            <div class="menu-item" id="theme-btn">
                <div class="menu-title">THEME</div>
                <div class="menu-select">Light</div>
            </div>
            <div class="menu-item" id="face-btn">
                <div class="menu-title">FONT FACE</div>
                <div id="font-example" class="menu-select">IBM Plex Mono</div>
            </div>
            <div class="menu-item" id="size-btn">
                <div class="menu-title">FONT SIZE</div>
                <div id="font-size-btn" class="menu-select">Medium</div>
            </div>
            <div class="menu-item" id="ai-provider-btn">
                <div class="menu-title">AI PROVIDER</div>
                <div class="menu-select" id="ai-provider-select">None</div>
                <div id="ai-key-container" class="ai-key-container" style="display: none;">
                    <input type="text" id="ai-api-key-input" class="ai-api-key-input" placeholder="API Key" autocomplete="off">
                </div>
            </div>
            <div class="menu-row">
                <div class="menu-button" id="load-btn">LOAD</div>
                <div class="menu-button" id="save-btn">SAVE</div>
            </div>
            <div class="menu-donate">
                <a href="https://boosty.to/evbkv/donate" target="_blank">☕ DONATE</a>
            </div>
            <div class="menu-copyright">
                © A4 Editor by <a href="https://evbkv.com" target="_blank">evbkv</a> – 2026, v1.0β
            </div>
        </div>
    </div>
    
    <!-- AI overlay window for interacting with AI assistant -->
    <div id="ai-overlay">
        <div id="ai-overlay-close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18"><path d="M 0 0 L 18 18 M 18 0 L 0 18"></path></svg></div>
        <div id="ai-input-row">
            <textarea id="ai-prompt-input" rows="1" placeholder="Enter your prompt..."></textarea>
            <button id="ai-send-btn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <line x1="4" y1="12" x2="20" y2="12" stroke="white" stroke-width="2"/>
                    <polyline points="14 6 20 12 14 18" stroke="white" stroke-width="2" fill="none"/>
                </svg>
            </button>
        </div>
        <!-- Row of saved prompt templates -->
        <div id="ai-prompts-row">
            <div class="ai-prompt-chip ai-prompt-more">
                <svg viewBox="0 0 16 16" width="12" height="12">
                    <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2"/>
                    <polyline points="10 4 14 8 10 12" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </div>
            <div class="ai-prompt-chip ai-prompt-add">
                <svg viewBox="0 0 16 16" width="12" height="12">
                    <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2"/>
                    <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="2"/>
                </svg>
            </div>
        </div>
        <!-- AI info label: shows whether processing all text or selection, balance, clear button -->
        <div id="ai-label">
            <span id="ai-label-text">All text</span>
            <span class="ai-label-right">
                <span id="ai-balance">...</span>
                <span class="ai-label-separator">|</span>
                <span id="ai-clear" class="ai-clear-link">Clear</span>
            </span>
        </div>
        <!-- AI result area -->
        <div id="ai-result">
        </div>
        <!-- Action buttons for applying AI result -->
        <div id="ai-actions">
            <button class="ai-action-btn">Change</button>
            <button class="ai-action-btn">Insert</button>
            <button class="ai-action-btn">Copy</button>
        </div>
        <!-- Donate link (shown after AI response) -->
        <div id="ai-donate">
            <a href="https://boosty.to/evbkv/donate" target="_blank">☕ DONATE</a>
        </div>
    </div>

    <!-- Modal for creating/editing prompt templates -->
    <div id="prompt-modal-overlay">
        <div id="prompt-modal-container">
            <div id="prompt-modal">
                <div id="prompt-modal-close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18"><path d="M 0 0 L 18 18 M 18 0 L 0 18"></path></svg></div>
                <div id="prompt-modal-title">New Prompt</div>
                <input type="text" id="prompt-modal-name" placeholder="Prompt name" autocomplete="off">
                <textarea id="prompt-modal-text" rows="4" placeholder="Enter prompt text..."></textarea>
                <div id="prompt-modal-actions">
                    <button id="prompt-modal-delete" class="prompt-modal-delete" style="display:none;">Delete</button>
                    <button id="prompt-modal-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
